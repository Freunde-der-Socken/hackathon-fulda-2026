# Production stack: docker compose -f compose.prod.yaml --env-file .env.prod up --build
# Or pull the prebuilt images from GHCR: docker compose -f compose.prod.yaml --env-file .env.prod pull && ... up -d
# Copy .env.prod.example to .env.prod first. Required secrets have no defaults.
name: hackathon-fulda-prod

services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/freunde-der-socken/hackathon-fulda-2026}-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${WEB_PORT:-80}:80'
      - '${WEB_HTTPS_PORT:-443}:443'
    volumes:
      # Certificates survive redeploys
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/freunde-der-socken/hackathon-fulda-2026}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
