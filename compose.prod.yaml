# Production stack: docker compose -f compose.prod.yaml --env-file .env.prod up --build
# Or pull the prebuilt images from GHCR: docker compose -f compose.prod.yaml --env-file .env.prod pull && ... up -d
# Copy .env.prod.example to .env.prod first. Required secrets have no defaults.
name: hackathon-fulda-prod

services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/freunde-der-socken/hackathon-fulda-2026}-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${WEB_PORT:-80}:80'
      - '${WEB_HTTPS_PORT:-443}:443'
    volumes:
      # Certificates survive redeploys
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/freunde-der-socken/hackathon-fulda-2026}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-app}
      MQTT_URL: mqtt://api:${MQTT_API_PASSWORD:?Set MQTT_API_PASSWORD in .env.prod}@mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?Set MQTT_API_PASSWORD in .env.prod}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?Set MQTT_DEVICE_PASSWORD in .env.prod}
    # Builds the password file from the env on every start, then runs the broker
    entrypoint:
      - sh
      - -c
      - |
        rm -f /mosquitto/passwd &&
        mosquitto_passwd -b -c /mosquitto/passwd api "$$MQTT_API_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/passwd device "$$MQTT_DEVICE_PASSWORD" &&
        chown mosquitto /mosquitto/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - '${MQTT_PORT:-1883}:1883' # devices
    volumes:
      - ./docker/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_pub -u api -P "$$MQTT_API_PASSWORD" -t healthcheck -m ok -i healthcheck',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mosquitto-data:
  caddy-data:
  caddy-config:
