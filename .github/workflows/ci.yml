name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm fmt:check
      - name: JSON Schemas are up to date
        run: |
          pnpm --filter @repo/contracts schemas
          git add --intent-to-add packages/contracts/schemas
          git diff --exit-code packages/contracts/schemas
      # Only errors fail the job. Warnings are reported but allowed.
      - run: pnpm turbo run lint typecheck build --cache-dir=.turbo/cache
