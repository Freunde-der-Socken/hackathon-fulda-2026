packages:
  - 'apps/*'
  - 'packages/*'

# Fail `pnpm install` on a Node version outside `engines` instead of only warning
engineStrict: true

# Shared dependency versions; reference them with "catalog:" in package.json
catalog:
  zod: ^4.6.7
  # vue-tsc does not support TypeScript 7 yet (it needs typescript/lib/tsc), so stay on 6.x
  typescript: 6.0.3
  '@types/node': ^24.0.0
  # TensorFlow.js packages must stay on the same exact version
  '@tensorflow/tfjs': 4.22.0
  '@tensorflow/tfjs-backend-wasm': 4.22.0

# Install scripts pnpm 11 may run; `pnpm install` fails on any dependency not listed here
allowBuilds:
  esbuild: true
  # Only prints a banner, but pnpm fails the install on any unlisted install script
  core-js: false
